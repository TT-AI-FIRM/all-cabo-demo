      <div class="grid g2"><div class="card"><h3>Cómo funciona la plataforma</h3><div class="small muted" style="line-height:1.55;">El huésped pide en la app de All Cabo. El despacho asigna la camioneta disponible más cercana, sea de la flota propia o de una flota aliada que trabaja dentro de la plataforma con el mismo estándar y la misma app del chofer. All Cabo cobra al cliente, se queda con su comisión y liquida al proveedor por transferencia; el proveedor paga chofer, gasolina y mantenimiento. El cliente siempre ve la marca All Cabo.</div></div><div class="card"><h3>Lo que el proveedor ve</h3><div class="small muted" style="line-height:1.55;">Sus choferes usan la app del chofer con los viajes que les toquen; el proveedor recibe un estado de cuenta por periodo con cada viaje, la comisión y el neto a pagar. En la fase real entra a un portal con su flota, sus liquidaciones y sus documentos.</div></div></div>`, 'Flotas aliadas', 'Otras transportadoras trabajan dentro de la plataforma; All Cabo cobra una comisión por cada viaje');

      const tipos = [['gasolina', 'Gasolina', 'fuel'], ['caseta', 'Casetas', 'road'], ['mantenimiento', 'Mantenimiento', 'gear'], ['lavado', 'Lavado', 'reset'], ['seguro', 'Seguros', 'card'], ['choferes', 'Pago a choferes', 'user'], ['estacionamiento', 'Estacionamiento', 'ticket'], ['otro', 'Otros', 'receipt']].filter(([t]) => f.por[t]);
      const lista = sel.fin.tipoGasto ? A.M.gastosDe(sel.fin.ym, sel.fin.tipoGasto) : []; const tipoN = (t) => (tipos.find(x => x[0] === t) || [t, t])[1];
      cuerpo = `<div class="gt">${tipos.map(([t, l, ic]) => `<button class="${sel.fin.tipoGasto === t ? 'on' : ''}" data-fg="${t}"><small>${l}</small><b>${mxn(f.por[t]).replace(' MXN', '')}</b><span>${pct(f.por[t] / Math.max(1, f.gastos) * 100, 0)} del mes${g.por[t] != null ? ' · ' + (f.por[t] >= g.por[t] ? '▲' : '▼') + ' ' + pct(Math.abs(d(f.por[t], g.por[t]) || 0), 0) + ' vs ' + g.mes : ''}</span></button>`).join('')}</div>
        <div class="grid g32">${chartCard({ id: 'fiGastos', title: 'Gastos por tipo', sub: `${f.mes} contra ${g.mes} · MXN`, big: mxn(f.gastos), delta: d(f.gastos, g.gastos), tipo: 'bar', horizontal: true, labels: tipos.map(x => x[1]), series: [{ label: f.mes, data: tipos.map(x => f.por[x[0]] || 0), color: '#F2A48B' }, { label: g.mes, data: tipos.map(x => g.por[x[0]] || 0), color: '#6F6A63' }], eje: 'Tipo', fmt: (v) => mxn(v), h: 220 })}<div class="card"><h3>Cómo se calcula</h3><div class="small muted" style="line-height:1.55;">Gasolina y casetas salen de cada viaje de la flota propia (kilómetros × rendimiento y autopista SJD). El pago a choferes es el ${Math.round(A.db.config.pagoChoferPct * 100)}% del viaje. Mantenimiento, lavado y seguro se registran por camioneta con su ticket. Las flotas aliadas no generan gastos aquí: el proveedor paga su gasolina y sus choferes.</div></div></div>
        ${sel.fin.tipoGasto ? `<div class="card" style="margin-top:12px;"><h3>${esc(tipoN(sel.fin.tipoGasto))} · ${esc(f.mes)} <span>· ${lista.length} registros · ${mxn(lista.reduce((a, x) => a + x.monto, 0))}</span></h3><div style="overflow-x:auto;max-height:420px;"><table><thead><tr><th>Fecha</th><th>Camioneta</th><th>Chofer</th><th>Detalle</th><th>Viaje</th><th class="num">MXN</th></tr></thead><tbody>${lista.slice(0, 120).map(x => { const v = A.vehiculo(x.vehiculoId); const c = x.choferId ? A.chofer(x.choferId) : null; const vi = x.viajeId ? A.viaje(x.viajeId) : null; return `<tr ${vi ? `class="click" data-v="${vi.id}"` : ''}><td class="nw">${esc(x.fecha)}${x.hora ? ' ' + esc(x.hora) : ''}</td><td class="small nw">${v ? esc(A.TIPOS_VEHICULO[v.tipo].corto) + ' <span class="plate">' + esc(v.placa) + '</span>' : '—'}</td><td class="small">${c ? esc(c.nombre) : '—'}</td><td class="small">${esc(x.detalle || x.tipo)}${x.foto ? ' 📷' : ''}</td><td class="small muted">${vi ? esc(lugarN(vi.origenId)) + ' → ' + esc(lugarN(vi.destinoId)) + ' · ' + esc(vi.nombre) : '—'}</td><td class="num">${mxn(x.monto)}</td></tr>`; }).join('')}</tbody></table></div>${lista.length > 120 ? `<div class="small muted" style="margin-top:8px;">Mostrando 120 de ${lista.length}.</div>` : ''}</div>` : '<div class="card" style="margin-top:12px;"><div class="small muted">Toca un tipo de gasto para ver cada registro: qué camioneta, qué chofer, qué viaje y el ticket.</div></div>'}`;
    } else if (sel.fin.vista === 'viajes') {
      const vs = A.M.viajesMes(sel.fin.ym);
      cuerpo = `<div class="card"><h3>Viajes de ${esc(f.mes)} ${f.anio} <span>· ${vs.length} en total · ${f.viajes} completados</span></h3><div style="overflow-x:auto;max-height:560px;"><table><thead><tr><th>Cuándo</th><th>Viaje</th><th>Cliente</th><th>Chofer / flota</th><th>Estado</th><th>Pago</th><th class="num">Total</th>${rol === 'dueno' ? '<th class="num">Para ACS</th>' : ''}</tr></thead><tbody>${vs.slice(0, 200).map(v => { const c = v.choferId ? A.chofer(v.choferId) : null; return `<tr class="click" data-v="${v.id}"><td class="nw num">${esc(v.fecha.slice(5))} ${esc(v.hora)}</td><td><b>${esc(lugarN(v.origenId))} → ${esc(lugarN(v.destinoId))}</b>${modoTxt(v)}</td><td class="small">${esc(v.nombre)} · ${v.pasajeros} pax</td><td class="small">${c ? esc(c.nombre.split(' ')[0]) : '—'} ${provPill(v)}</td><td>${estadoPill(v)}</td><td>${pagoPill(v)}</td><td class="num">${usd(v.precio.total)}</td>${rol === 'dueno' ? `<td class="num">${v.estado === 'completado' ? usd(v.neto == null ? v.precio.total : v.neto) : '—'}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>${vs.length > 200 ? `<div class="small muted" style="margin-top:8px;">Mostrando 200 de ${vs.length}.</div>` : ''}</div>`;
    } else {
      const fa = A.M.flotaAliada(sel.fin.aliadaTodo ? null : sel.fin.ym); const per = sel.fin.aliadaTodo ? '12 meses' : f.mes + ' ' + f.anio;
      cuerpo = `<div class="row" style="flex-wrap:wrap;margin-bottom:10px;"><h3 style="font-size:14px;">Lo que dejan las flotas que no son suyas <span class="muted" style="font-weight:500;">· ${esc(per)}</span></h3><span class="seg"><button class="${!sel.fin.aliadaTodo ? 'on' : ''}" data-fat="0">Este mes</button><button class="${sel.fin.aliadaTodo ? 'on' : ''}" data-fat="1">12 meses</button></span></div>
        <div class="kgrid">${kpi({ icon: 'trips', label: 'Viajes cubiertos', value: fa.viajes, sub: 'por camionetas de otras empresas, con la marca All Cabo' })}${kpi({ icon: 'money', label: 'Venta al cliente', value: usd(fa.venta), sub: 'lo que pagó el pasajero' })}${kpi({ icon: 'tag', label: 'Ingreso para ACS', value: usd(fa.comision), cls: 'good', sub: 'comisión de plataforma, sin gasolina ni chofer' })}${kpi({ icon: 'ticket', label: 'Ganancia por viaje', value: usd(fa.porViaje), sub: 'comisión promedio por traslado' })}${kpi({ icon: 'card', label: 'Pagado a proveedores', value: usd(fa.aPagar), sub: 'el proveedor paga chofer, gasolina y mantenimiento' })}${kpi({ icon: 'people', label: 'Clientes atendidos', value: fa.clientes, sub: 'huéspedes que viajaron en flota aliada' })}</div>
        <div class="grid g2">${fa.proveedores.map(p => `<div class="card"><div class="row"><div><b style="font-size:15px;">${esc(p.proveedor.nombre)}</b><div class="small muted">${esc(p.proveedor.contacto || '')} · ${esc(p.proveedor.zona || '')} · comisión ${pct(p.proveedor.comision * 100, 0)} · ${p.vehiculos.length} camioneta${p.vehiculos.length === 1 ? '' : 's'}</div></div>${p.calif ? `<span class="rating">★ ${p.calif.toFixed(2)}</span>` : ''}</div>
          <div class="kgrid" style="grid-template-columns:repeat(4,1fr);margin-top:10px;"><div class="k" style="aspect-ratio:auto;animation:none;padding:10px;"><small>Viajes</small><b style="font-size:18px;">${p.viajes}</b></div><div class="k" style="aspect-ratio:auto;animation:none;padding:10px;"><small>Venta</small><b style="font-size:16px;">${usd(p.venta)}</b></div><div class="k" style="aspect-ratio:auto;animation:none;padding:10px;"><small>Para ACS</small><b style="font-size:16px;color:var(--ok);">${usd(p.comision)}</b></div><div class="k" style="aspect-ratio:auto;animation:none;padding:10px;"><small>Por viaje</small><b style="font-size:16px;">${usd(p.porViaje)}</b></div></div>
          <h3 style="margin-top:12px;">Choferes y su calificación</h3>${p.choferes.map(c => `<div class="kv"><span class="cellrow"><span class="avatar" style="width:26px;height:26px;flex-basis:26px;font-size:9px;">${ini(c.chofer.nombre)}</span>${esc(c.chofer.nombre)} <span class="muted small">· ${esc(c.vehiculo ? A.TIPOS_VEHICULO[c.vehiculo.tipo].corto + ' ' + c.vehiculo.placa : '')}</span></span><span class="small"><span class="rating">★ ${c.calif.toFixed(2)}</span> · ${c.viajes} viajes · ${usd(c.ingreso)}${c.n5 ? ' · ' + c.n5 + ' de 5★' : ''}</span></div>`).join('') || '<div class="muted small">Sin choferes registrados.</div>'}
          <h3 style="margin-top:12px;">Clientes que viajaron con ellos <span>· ${p.clientes.length}</span></h3>${p.clientes.slice(0, 6).map(c => `<div class="kv small"><span>${esc(c.nombre)} <span class="muted">· ${c.viajes} viaje${c.viajes === 1 ? '' : 's'} · último ${esc(c.ultimo)}</span></span><b class="num">${usd(c.gasto)}</b></div>`).join('') || '<div class="muted small">Ninguno en el periodo.</div>'}${p.clientes.length > 6 ? `<div class="tiny muted" style="margin-top:6px;">y ${p.clientes.length - 6} más</div>` : ''}
          <div class="row" style="margin-top:12px;"><span class="small ${p.pendiente ? '' : 'muted'}">${p.pendiente ? '<b style="color:var(--warn)">' + usd(p.pendiente) + '</b> por liquidar al proveedor' : 'Liquidaciones al día'}</span>${p.pendiente ? `<button class="btn sec sm" data-liq="${p.proveedor.id}">Liquidar</button>` : ''}</div></div>`).join('')}</div>`;
    }
    shell(kpis + barra + tabs + `<div style="margin-top:12px;">${cuerpo}</div>`, 'Finanzas', 'Ingresos, gastos y utilidad por mes; toca cualquier número para entrar al detalle');
    $$('[data-fsel]').forEach(sl => sl.onchange = () => { sel.fin[sl.dataset.fsel] = sl.value; render(); }); $$('[data-fv]').forEach(b => b.onclick = () => { sel.fin.vista = b.dataset.fv; render(); }); $$('[data-fym]').forEach(tr => tr.onclick = () => { if (tr.dataset.fym === sel.fin.ym) return; sel.fin.cmp = sel.fin.ym; sel.fin.ym = tr.dataset.fym; render(); });
    $$('[data-fg]').forEach(b => b.onclick = () => { sel.fin.tipoGasto = sel.fin.tipoGasto === b.dataset.fg ? null : b.dataset.fg; render(); }); $$('[data-fat]').forEach(b => b.onclick = () => { sel.fin.aliadaTodo = b.dataset.fat === '1'; render(); });
    $$('tr[data-v]').forEach(tr => tr.onclick = () => detalleViaje(tr.dataset.v)); $$('[data-liq]').forEach(b => b.onclick = () => { const r = A.liquidarProveedor(b.dataset.liq); toast(`Liquidación registrada: ${r.n} viajes · ${usd(r.monto)}`); render(); });
  }

  // ═════════════ MÁS · CONFIG ═════════════
  function vMas() {
    const tiles = SECCIONES.filter(x => x.grupo === 'mas' && x.id !== 'mas' && permitido(x.id));
    shell(`<div class="tiles">${tiles.map(x => `<button class="tile" data-go="${x.id}"><span class="ic">${I(x.icon)}</span><b>${x.label}</b><span class="small muted">Tarifas por zona, extras, espera en aeropuerto, tipo de cambio, pago a choferes y velocidad del demo.</span></button>`).join('')}<a class="tile" href="../cliente/" target="_blank" rel="noopener"><span class="ic">${I('user')}</span><b>App del cliente</b><span class="small muted">Lo que ve el huésped: reservar, pagar, seguir su camioneta y hablar con el chofer.</span></a><a class="tile" href="../chofer/" target="_blank" rel="noopener"><span class="ic">${I('fleet')}</span><b>App del chofer</b><span class="small muted">Viajes que llegan solos, navegación, estados, checklist, gastos y chat.</span></a><button class="tile" id="btnRol"><span class="ic">${I('people')}</span><b>Cambiar rol</b><span class="small muted">Entraste como ${esc(ROLES[rol])}.</span></button><button class="tile" id="btnResetMas"><span class="ic">${I('reset')}</span><b>Reiniciar demo</b><span class="small muted">Regresa los datos ilustrativos al inicio.</span></button></div>
      <div class="card" style="margin-top:12px;"><h3>Sobre este demo</h3><div class="small muted" style="line-height:1.55;">Plataforma de traslados de All Cabo Services: el huésped reserva y paga desde su web app (viaje sencillo, por hora o la estancia completa, con paradas, extras, sugerencias y amigos); el viaje se asigna al chofer más cercano de la flota propia o de una flota aliada, que trabaja dentro de la plataforma a cambio de una comisión; la central ve GPS, vuelos, cobros, aliados, flota y liquidaciones; el tablero y el asistente de IA le contestan al dueño. Los datos son ilustrativos y viven en este navegador; pagos, WhatsApp, vuelos y el GPS de la flota están simulados (el GPS del teléfono del chofer puede ser real). En la fase real todo corre en la nube y se sincroniza entre dispositivos.</div></div>`, 'Más', 'Configuración, las otras apps y ajustes del demo');
    $('#btnRol').onclick = () => { rol = null; sessionStorage.removeItem('acs_rol'); render(); }; $('#btnResetMas').onclick = () => { if (confirm('¿Reiniciar todos los datos del demo en este navegador?')) { A.reset(); toast('Datos reiniciados'); render(); } };
  }
  function vConfig() {
    const cfg = A.db.config;
    shell(`<div class="grid g2" style="margin-top:0;"><div class="card"><h3>Tarifas por zona <span>· USD, publicadas en su sitio</span></h3>${Object.values(cfg.zonas).map(z => `<div class="grid2" style="margin-top:6px;"><div><label class="lbl">${esc(z.es)} · sencillo</label><input class="txt" data-z="${z.id},sencillo" type="number" value="${z.sencillo}"></div><div><label class="lbl">redondo</label><input class="txt" data-z="${z.id},redondo" type="number" value="${z.redondo}"></div></div>`).join('')}<h3 style="margin-top:14px;">Extras</h3>${cfg.extras.map(e => `<div class="row" style="margin-top:6px;"><span class="small">${esc(e.es)} <span class="muted">· ${esc(e.en)}</span></span><input class="txt" data-ex="${e.id}" type="number" value="${e.precio}" style="width:110px;text-align:right;"></div>`).join('')}</div>
      <div><div class="card"><h3>Operación</h3><label class="lbl">Minutos de espera tras aterrizar</label><input class="txt" id="cEspera" type="number" value="${cfg.esperaAeropuerto}"><label class="lbl">Tipo de cambio MXN por USD</label><input class="txt" id="cTc" type="number" step="0.01" value="${cfg.tipoCambio}"><label class="lbl">Pago al chofer (% del viaje) · supuesto configurable</label><input class="txt" id="cPago" type="number" value="${Math.round(cfg.pagoChoferPct * 100)}"><div class="grid2"><div><label class="lbl">Gasolina MXN por km</label><input class="txt" id="cKm" type="number" step="0.1" value="${cfg.mxnPorKm}"></div><div><label class="lbl">Caseta MXN</label><input class="txt" id="cCaseta" type="number" value="${cfg.caseta}"></div></div></div>
      <div class="card" style="margin-top:12px;"><h3>Plataforma, servicio por hora y paradas <span>· USD</span></h3><label class="lbl">Comisión de la plataforma sobre viajes de flotas aliadas (%)</label><input class="txt" id="cCom" type="number" value="${Math.round((cfg.comisionPlataforma || 0.2) * 100)}"><div class="tiny muted" style="margin-top:4px;">Cada proveedor puede tener su propio porcentaje en Flotas aliadas; este es el valor por defecto.</div><label class="lbl">Tarifa por hora con chofer</label><div class="grid2">${Object.values(A.TIPOS_VEHICULO).map(t => `<div><label class="lbl" style="margin-top:4px;">${esc(t.corto)}</label><input class="txt" data-h="${t.id}" type="number" value="${(cfg.horaVehiculo || {})[t.id] || 75}"></div>`).join('')}</div><div class="grid2"><div><label class="lbl">Horas mínimas</label><input class="txt" id="cHmin" type="number" value="${cfg.horasMin || 3}"></div><div><label class="lbl">Precio por parada</label><input class="txt" id="cParada" type="number" value="${cfg.paradaPrecio == null ? 25 : cfg.paradaPrecio}"></div></div><div class="tiny muted" style="margin-top:6px;">Regla de la casa: sin descuentos en la flota. El valor premium está en la app: paradas, extras, itinerario y sugerencias con precio claro.</div></div>
      <div class="card" style="margin-top:12px;"><h3>Demo</h3><label class="lbl">Velocidad del GPS simulado (× tiempo real)</label><input class="txt" id="cFactor" type="number" value="${cfg.factorDemo}"><div class="tiny muted" style="margin-top:6px;">Con ×${cfg.factorDemo}, un traslado de 40 minutos se ve en unos ${Math.round(40 * 60 / cfg.factorDemo)} segundos.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><button class="btn sec sm" id="btnExport">Exportar datos (JSON)</button><button class="btn bad sm" id="btnReset">Reiniciar datos</button></div></div></div></div>
      <button class="btn xl" id="cfgGo" style="margin-top:14px;">Guardar configuración</button>`, 'Configuración', 'Tarifas, extras, espera en aeropuerto, costos y velocidad del demo');
    $('#cfgGo').onclick = () => { $$('[data-z]').forEach(i => { const [z, k] = i.dataset.z.split(','); cfg.zonas[z][k] = Number(i.value) || 0; }); $$('[data-ex]').forEach(i => { const e = cfg.extras.find(x => x.id === i.dataset.ex); if (e) e.precio = Number(i.value) || 0; }); cfg.esperaAeropuerto = Number($('#cEspera').value) || 35; cfg.tipoCambio = Number($('#cTc').value) || cfg.tipoCambio; cfg.pagoChoferPct = (Number($('#cPago').value) || 25) / 100; cfg.mxnPorKm = Number($('#cKm').value) || cfg.mxnPorKm; cfg.caseta = Number($('#cCaseta').value) || 0; cfg.comisionPlataforma = Math.max(0, Math.min(1, (Number($('#cCom').value) || 20) / 100)); cfg.horaVehiculo = cfg.horaVehiculo || {}; $$('[data-h]').forEach(i => { cfg.horaVehiculo[i.dataset.h] = Number(i.value) || 75; }); cfg.horasMin = Math.max(1, Number($('#cHmin').value) || 3); cfg.paradaPrecio = Math.max(0, Number($('#cParada').value) || 0); cfg.factorDemo = Math.max(1, Number($('#cFactor').value) || 25); A.save(); toast('Configuración guardada; las tres apps la usan ya'); };
    $('#btnExport').onclick = () => { const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(A.db, null, 1)); a.download = 'all-cabo-demo.json'; a.click(); };
    $('#btnReset').onclick = () => { if (confirm('¿Reiniciar todos los datos del demo en este navegador?')) { A.reset(); toast('Datos reiniciados'); render(); } };
  }

  // ═════════════ render ═════════════
  function render() { pendCharts = {}; if (map) { map.remove(); map = null; layers = {}; } if (!rol) { vLogin(); return; } if (!permitido(view)) view = home(); ({ mapa: vMapa, viajes: vViajes, vuelos: vVuelos, clientes: vClientes, aliados: vAliados, cuentas: vCuentas, sugerencias: vSugerencias, flota: vFlota, choferes: vChoferes, gastos: vGastos, proveedores: vProveedores, tablero: vTablero, finanzas: vFinanzas, mas: vMas, config: vConfig }[view] || vMapa)(); }
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v && v !== view) { hist.push(view); view = v; render(); } });
  A.on((motivo) => { if (motivo === 'sim') { actualizarMapa(); actualizarFlota(); return; } if ($('#sheetBg')) return; if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return; render(); });
  A.onEvento((ev) => { if (!rol) return; const v = ev.viajeId ? A.viaje(ev.viajeId) : null; if (!v) return; if (ev.tipo === 'viaje_asignado') toast(`Reserva de ${v.nombre} asignada a ${A.chofer(ev.choferId).nombre}`); if (ev.tipo === 'estado') toast(`${A.ESTADOS[ev.estado].es} · ${v.nombre}`); if (ev.tipo === 'mensaje') toast(`Mensaje ${ev.de === 'cliente' ? 'del cliente' : 'del chofer'} · ${v.nombre}`); });
  render();
})();
</script>
</body>
</html>
