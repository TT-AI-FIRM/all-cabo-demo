  function go(v) { if (v === 'trips' && view !== 'trips') { sel.list = false; } view = v; location.hash = v; render(); $('#panel').scrollTo(0, 0); window.scrollTo(0, 0); }

  function layout(main, opts) { opts = opts || {}; if (!desktop() && opts.mapa) { const u = user(); $('#root').innerHTML = `<div class="ub"><div class="ub-map"><div id="map" class="map"></div></div><div class="ub-top"><span class="ub-logo"><img src="../shared/img/logo.png" alt="All Cabo Services"></span><div class="who"><span class="pill gold">Los Cabos</span><button class="avatar press" id="btnUser" title="Switch guest (demo)">${ini(u.nombre)}</button></div></div><div class="ub-sheet"><div class="ub-handle"></div>${main}</div></div>`; bindHeader(); return; } $('#root').innerHTML = header() + main; bindHeader(); }
  const ubActivo = () => !desktop() && !!$('.ub-map');

  // ═════════════ BOOK · paso a paso: a dónde → cuándo → camioneta → pagar ═════════════

  const lugares = A.LUGARES.filter(l => l.tipo !== 'aeropuerto');

  const syncModo = () => { B.modo = B.servicio === 'hours' ? 'hours' : (B.servicio === 'stay' ? 'stay' : (B.origenId === 'sjd' ? 'from_airport' : (B.destinoId === 'sjd' ? 'to_airport' : 'between'))); if (B.modo !== 'from_airport' && B.modo !== 'to_airport') B.redondo = false; };

  const MODES = [['from_airport', 'Airport pickup', 'plane'], ['to_airport', 'To the airport', 'planeUp'], ['between', 'Point to point', 'pin'], ['hours', 'By the hour', 'clock'], ['stay', 'Plan my stay', 'stay']];
  const SERV = [['ride', 'Ride'], ['hours', 'By the hour'], ['stay', 'Plan my stay']];
  const segServicio = (cur) => `<div class="seg serv">${SERV.map(([id, l]) => `<button data-serv="${id}" class="${cur === id ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const PASOS_B = ['Where', 'When', 'Ride', 'Pay'];
  const stepsBar = (n) => `<div class="steps">${PASOS_B.map((l, i) => `<i class="${n >= i + 1 ? 'on' : ''}"></i>`).join('')}</div>`;
  function setServicio(id) { B.servicio = id; B.paso = 1; if (id === 'hours') { if (B.origenId === 'sjd') B.origenId = hotelDe(user()); if (B.destinoId === 'sjd' || B.destinoId === B.origenId) B.destinoId = 'ff'; B.cuando = 'schedule'; } if (id === 'ride' && B.origenId !== 'sjd' && B.destinoId !== 'sjd') { B.origenId = 'sjd'; B.destinoId = hotelDe(user()); B.cuando = 'schedule'; } syncModo(); }

    $$('[data-addstay]').forEach(b => b.onclick = () => { const s = A.sugerencia(b.dataset.addstay); const it = its[0]; const dias = Array.from({ length: it.noches }, (_, i) => A.sumaDias(it.llegada.fecha, i + 1)); sheet(`<div class="row"><h3>Add to your stay</h3><button class="btn sec sm" id="cls">Close</button></div><div class="act" style="border:0;"><span class="ph" style="background:${s.color}">${s.icono}</span><div class="nm"><b>${esc(s.nombre)}</b><span>${esc(s.tagline)}</span></div></div><div class="grid2"><div><label class="lbl">Day</label><select class="txt" id="adDia">${dias.map(d => `<option value="${d}">${A.fechaLarga(d, true).replace(', 2026', '')}</option>`).join('')}</select></div><div><label class="lbl">Time</label><input class="txt" type="time" id="adHora" value="${s.cat === 'restaurant' ? '18:30' : '09:00'}"></div></div><label class="lbl">Your driver</label><div class="seg" style="display:flex;"><button class="on" data-esp="1" style="flex:1;">Waits for you · ${s.duracion || 3} h</button><button data-esp="0" style="flex:1;">Drops off & comes back</button></div><button class="btn xl full" id="adGo" style="margin-top:14px;">Add ride</button>`); let esperar = true; $$('[data-esp]').forEach(x => x.onclick = () => { esperar = x.dataset.esp === '1'; $$('[data-esp]').forEach(y => y.classList.toggle('on', y === x)); }); $('#adGo').onclick = () => { const fecha = $('#adDia').value, hora = $('#adHora').value || '18:30'; const dur = s.duracion || 3; const v = A.solicitarViaje({ clienteId: userId, fecha, hora, origenId: it.hotelId, destinoId: s.lugarId, modo: esperar ? 'horas' : 'redondo', horas: dur, regresoHora: esperar ? null : A.hmDe(A.minutosDe(hora) + dur * 60), vehiculo: it.vehiculo, pasajeros: it.pax, maletas: 0, extras: [], notas: esperar ? `Driver waits · ${dur} h` : 'Pickup back at ' + A.hora12(A.hmDe(A.minutosDe(hora) + dur * 60)), canal: 'app', itinerarioId: it.id, pago: { ...it.pago, ref: '' } }); v.etiqueta = s.nombre; it.viajeIds.push(v.id); it.total += v.precio.total; it.actividades.push({ sugerenciaId: s.id, fecha, hora, esperar, horas: dur }); A.save(); closeSheet(); toast(`${s.nombre} added · ${usd(v.precio.total)} charged to your ${A.METODOS[it.pago.metodo].en}`); sel.tripId = null; sel.list = true; go('trips'); }; });
    if (!desktop()) mapaExplore($('#map'));
    sideUpdate();
  }

  // ═════════════ FRIENDS ═════════════
  function vFriends() {
    const u = user(); const am = amigos(); const inv = A.db.invitaciones.filter(i => i.para === u.id && i.estado === 'pendiente'); const enviadas = A.db.invitaciones.filter(i => i.de === u.id && i.estado === 'pendiente');
    const conmigo = A.viajesCompartidosCon(u.id).filter(v => !done(v)); const mios = misViajes().filter(v => (v.compartidoCon || []).length && !done(v));
    layout(`<main><div class="hero"><h1>Friends & <em>family.</em></h1><p>Share a live trip so they know where you are, or split the fare so everyone pays their part.</p></div>
      <div class="card"><h3>Add a friend</h3><div class="row"><input class="txt" id="fInv" placeholder="Email, phone or name"><button class="btn" id="fGo">Invite</button></div><div class="tiny muted" style="margin-top:6px;">They get a link to All Cabo; once they accept, you can share rides and split fares. Demo: try «emily.chen@mail.com».</div></div>
      ${inv.length ? `<div class="card gold" style="margin-top:10px;"><h3>Invitations</h3>${inv.map(i => { const c = A.cliente(i.de); return `<div class="friend"><span class="avatar">${ini(c.nombre)}</span><div class="nm"><b>${esc(c.nombre)}</b><span>${esc(c.ciudad)} · wants to share rides with you</span></div><button class="btn sm" data-acc="${i.id}">Accept</button></div>`; }).join('')}</div>` : ''}
      <div class="card" style="margin-top:10px;"><h3>Your circle <span>· ${am.length}</span></h3>${am.map(a => `<div class="friend"><span class="avatar">${ini(a.nombre)}</span><div class="nm"><b>${esc(a.nombre)}</b><span>${esc(a.ciudad)} · ${a.visitas} trips with us</span></div><button class="btn sm sec" data-book="${a.id}">Book together</button></div>`).join('') || '<div class="small muted">No friends yet. Invite someone above.</div>'}${enviadas.length ? `<div class="tiny muted" style="margin-top:8px;">Pending: ${enviadas.map(i => esc(i.contacto)).join(', ')}</div>` : ''}</div>
      ${conmigo.length ? `<h3 class="eyebrow" style="margin:16px 0 8px 0;">Shared with you</h3>${conmigo.map(v => cardViaje(v, v.partes && v.partes[u.id] ? `<span class="pill ${v.partes[u.id].estado === 'pagado' ? 'ok' : 'warn'}">Your share ${usd(v.partes[u.id].monto)} · ${v.partes[u.id].estado === 'pagado' ? 'paid' : 'to pay'}</span> ` : `<span class="pill info">by ${esc(first(v.nombre))}</span> `)).join('')}` : ''}
      ${mios.length ? `<h3 class="eyebrow" style="margin:16px 0 8px 0;">Your rides shared with friends</h3>${mios.map(v => cardViaje(v, `<span class="pill info">${v.compartidoCon.map(id => esc(first((A.cliente(id) || {}).nombre || ''))).join(', ')}</span> `)).join('')}` : ''}
      <div class="card" style="margin-top:14px;"><h3>Safety first</h3><div class="small muted">Every ride has a live link with the car on the map, the driver's name and the plate. Share it with anyone from the trip screen; no account needed on their side.</div></div></main>`);
    $('#fGo').onclick = () => { const r = A.invitarAmigo(u.id, $('#fInv').value); toast(r.estado === 'agregado' ? `${r.cliente.nombre} is now in your circle` : 'Invitation sent (simulated)'); render(); }; $('#fInv').onkeydown = (e) => { if (e.key === 'Enter') $('#fGo').click(); };
    $$('[data-acc]').forEach(b => b.onclick = () => { A.aceptarInvitacion(b.dataset.acc); toast('Friend added'); render(); });
    $$('[data-book]').forEach(b => b.onclick = () => { B.split = true; B.splitCon = [b.dataset.book]; B.servicio = 'ride'; B.origenId = hotelDe(u); B.destinoId = 'ff'; B.cuando = 'schedule'; B.hora = '18:30'; B.paso = 1; syncModo(); go('book'); toast('Fare will be split with ' + first((A.cliente(b.dataset.book) || {}).nombre || '')); });
    $$('[data-t]').forEach(b => b.onclick = () => { sel.tripId = b.dataset.t; go('trips'); });
    sideUpdate();
  }

  // ═════════════ ACCOUNT ═════════════
  function vAccount() {
    const u = user(); const cta = u.cuentaId ? A.db.cuentas.find(x => x.id === u.cuentaId) : null; const vs = misViajes().filter(v => v.estado === 'completado');
    layout(`<main><div class="hero"><h1>${esc(first(u.nombre))}'s <em>account.</em></h1><p>${esc(u.ciudad)} · ${u.visitas} trips with us${u.vip ? ' · <span class="pill gold">VIP guest</span>' : ''}</p></div>
      <div class="card"><h3>Profile</h3><div class="kv"><span>Name</span><span>${esc(u.nombre)}</span></div><div class="kv"><span>Phone</span><span>${esc(u.tel)}</span></div><div class="kv"><span>Email</span><span>${esc(u.email)}</span></div><div class="kv"><span>Usual hotel</span><span>${esc(lugarN(hotelDe(u)))}</span></div><div class="kv"><span>Preferences</span><span style="text-align:right;">${esc(u.preferencias || 'None yet')}</span></div></div>
      <div class="card" style="margin-top:10px;"><h3>Payment</h3><div class="kv"><span> Pay</span><span class="pill ok">Default</span></div><div class="kv"><span>Zelle</span><span>${esc(u.email)}</span></div><div class="kv"><span>Visa •••• 4242</span><span>Exp 09/28</span></div></div>
      ${cta ? `<div class="card gold" style="margin-top:10px;"><h3>${esc(cta.tipo)} account</h3><b style="font-size:15px;">${esc(cta.nombre)}</b><div class="small muted" style="margin-top:4px;">Coordinator ${esc(cta.contacto)} · one monthly invoice. Your rides are billed to the account.</div></div>` : ''}
      <div class="card" style="margin-top:10px;"><h3>With All Cabo Services</h3><div class="row"><span class="muted small">${vs.length} completed rides</span><b style="font-size:20px;">${usd(u.gasto)}</b></div><div class="small muted" style="margin-top:6px;">Receipts per trip by email. Add this app to your home screen for one-tap booking.</div></div>
      <div class="card" style="margin-top:10px;"><h3>Demo controls</h3><div class="grid2"><button class="btn sec sm" id="acDev">${desktop() ? 'Phone layout' : 'Desktop layout'}</button><button class="btn ghost sm" id="acReset">Reset demo data</button></div><div class="tiny muted" style="margin-top:6px;">The app detects the device on its own; this switch is only to preview both layouts.</div></div>
      <p class="demo-note">Demo data lives in this browser only. Payments, WhatsApp and emails are simulated.</p></main>`);
    $('#acDev').onclick = () => { A.fijarDispositivo(desktop() ? 'mobile' : 'desktop'); render(); }; $('#acReset').onclick = () => { if (confirm('Reset all demo data in this browser?')) { A.reset(); render(); } };
    sideUpdate();
  }

  // ═════════════ TRACK (enlace público de seguimiento) ═════════════
  function vTrack(v) {
    const c = v.choferId ? A.chofer(v.choferId) : null; const veh = c ? A.vehiculo(c.vehiculoId) : null; const [t1, t2] = etaLineas(v);
    $('#nav').style.display = 'none'; document.documentElement.dataset.device = 'mobile'; $('#panel').style.maxWidth = '560px';
    $('#root').innerHTML = `<div class="track"><div class="top" style="padding-left:0;padding-right:0;"><img src="../shared/img/logo.png" alt="All Cabo Services" style="height:26px;"><span class="pill gold">Live trip</span></div>
      <div class="mapwrap"><div id="map" class="map"></div><div class="eta etacard"><div><b>${esc(t1)}</b><span>${esc(t2)}</span></div>${c ? `<span class="avatar">${ini(c.nombre)}</span>` : ''}</div></div>
      <div class="card"><b style="font-size:15px;">${esc(first(v.nombre))}'s ride · ${esc(lugarN(v.origenId))} → ${esc(lugarN(v.destinoId))}</b><div class="small muted" style="margin-top:4px;">${A.fechaLarga(v.fecha, true)} · pickup ${A.hora12(v.hora)} · <span class="pill" style="color:${A.ESTADOS[v.estado].color}">${esc(A.ESTADOS[v.estado].en)}</span></div>${c ? `<div class="drv" style="margin-top:12px;"><div class="avatar">${ini(c.nombre)}</div><div style="flex:1;"><b>${esc(c.nombre)}</b><div class="small muted">${esc(A.TIPOS_VEHICULO[veh.tipo].nombre)} · ${esc(veh.color)}</div></div><span class="plate">${esc(veh.placa)}</span></div>` : ''}</div>
      <p class="demo-note">Shared by ${esc(v.nombre)} through All Cabo Services. This page shows the vehicle position, driver and plate only.</p></div>`;
    dibujarMapa(v, $('#map'));
  }

  // ═════════════ render + eventos ═════════════
  function render() {
    if (map) { map.remove(); map = null; } layers = {};
    const track = qs.get('track'); if (track && A.viaje(track)) { vTrack(A.viaje(track)); return; }
    if (view === 'stay') { view = 'book'; B.servicio = 'stay'; B.modo = 'stay'; }
    ({ book: vBook, trips: vTrips, explore: vExplore, friends: vFriends, account: vAccount }[view] || vBook)(); renderNav();
    if (!desktop() && side) { side.remove(); side = null; }
  }
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v && v !== view) { view = v; render(); } });
  window.addEventListener('resize', () => { const d = document.documentElement.dataset.device; if (map) map.invalidateSize(); if (side) side.invalidateSize(); clearTimeout(window.__rz); window.__rz = setTimeout(() => { if (document.documentElement.dataset.device !== d) render(); else if (map && layers && layers.viajeId) actualizarMapa(); }, 150); });
  A.on((motivo) => { if (motivo === 'sim') { actualizarMapa(); return; } if ($('#sheetBg')) { if (window.__chatViaje && $('#chatBox')) { const ms = A.mensajesDe(window.__chatViaje); $('#chatBox').innerHTML = ms.map(m => `<div class="cb ${m.de === 'cliente' ? 'me' : 'them'}">${esc(m.texto)}<time>${new Date(m.t).toTimeString().slice(0, 5)}</time></div>`).join(''); $('#chatBox').scrollTop = 1e6; } return; } if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return; render(); });
  A.onEvento((ev) => { const v = ev.viajeId ? A.viaje(ev.viajeId) : null; if (!v) return; if (ev.tipo === 'compartido' && ev.para === userId) { toast(`${first(v.nombre)} shared a ride with you`); return; } if (v.clienteId !== userId && !(v.compartidoCon || []).includes(userId)) return; if (ev.tipo === 'viaje_asignado') toast(`${A.chofer(ev.choferId).nombre} is your driver`); if (ev.tipo === 'estado') toast({ en_camino: 'Your driver is on the way', llegue: 'Your driver has arrived' + (v.origenId === 'sjd' ? ' · Door 3' : ''), a_bordo: 'Enjoy the ride!', completado: 'Trip completed · receipt sent', cancelado: 'Trip cancelled' }[ev.estado] || ''); if (ev.tipo === 'mensaje' && ev.de === 'chofer') toast('New message from your driver'); if (ev.tipo === 'llegada' && ev.fase === 'a_recoger') toast('Your driver is arriving now'); });
  render();
})();
