<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0C">
<title>All Cabo Services · Your ride in Los Cabos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../shared/img/fav.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ── disposición: móvil (una columna) y escritorio (panel + mapa) ── */
  html, body { height: 100%; }
  body { background: var(--bg); }
  #app { min-height: 100vh; }
  #panel { position: relative; min-height: 100vh; }
  #side { display: none; }
  html[data-device="mobile"] #panel { max-width: 480px; margin: 0 auto; }
  html[data-device="desktop"] #app { display: grid; grid-template-columns: 500px minmax(0, 1fr); height: 100vh; }
  html[data-device="desktop"] #panel { height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; }
  html[data-device="desktop"] #panel nav#nav { order: -1; flex: 0 0 auto; } html[data-device="desktop"] #panel #root { flex: 1 0 auto; }
  html[data-device="desktop"] #side { display: block; position: relative; background: #0E0E10; }
  html[data-device="desktop"] #side .map { position: absolute; inset: 0; }
  html[data-device="desktop"] #side .over { position: absolute; left: 24px; right: 24px; bottom: 24px; z-index: 500; display: flex; justify-content: center; pointer-events: none; }
  html[data-device="desktop"] #side .over > * { pointer-events: auto; }
  html[data-device="desktop"] .mapwrap.inline { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px 18px; }
  .top img { height: 26px; display: block; }
  .top .who { display: flex; align-items: center; gap: 8px; }
  main { padding: 6px 18px calc(92px + env(safe-area-inset-bottom)) 18px; }
  html[data-device="desktop"] main { padding-bottom: 40px; }
  .hero { margin: 6px 0 16px 0; }
  .hero h1 { font-weight: 500; font-size: 30px; line-height: 1.02; letter-spacing: -.03em; }
  .hero h1 em { font-style: normal; color: var(--gold); }
  .hero p { color: var(--muted); margin: 8px 0 0 0; font-size: 14px; }
  /* navegación: pestañas abajo en móvil, fila arriba en escritorio */
  nav#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: rgba(11,11,12,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)) 6px; z-index: 40; }
  nav#nav .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 6px 0; border-radius: 12px; transition: transform 160ms var(--ease), color 160ms ease; }
  nav#nav .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav#nav .tab.on { color: var(--gold); }
  nav#nav .tab .n { position: absolute; margin-left: 22px; margin-top: -4px; background: var(--brick2); color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px; padding: 1px 5px; }
  html[data-device="desktop"] nav#nav { position: sticky; top: 0; transform: none; left: auto; max-width: none; border-top: 0; border-bottom: 1px solid var(--line); padding: 6px 12px; gap: 4px; }
  html[data-device="desktop"] nav#nav .tab { flex: 0 0 auto; flex-direction: row; gap: 8px; padding: 9px 14px; font-size: 12.5px; letter-spacing: .02em; }
  html[data-device="desktop"] nav#nav .tab.on { background: var(--panel3); }
  html[data-device="desktop"] nav#nav .tab svg { width: 18px; height: 18px; }
  /* piezas */
  .steps { display: flex; gap: 6px; margin: 0 0 14px 0; } .steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--line); } .steps i.on { background: var(--gold); }
  .modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 6px; }
  .mode { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .02em; text-align: center; line-height: 1.15; transition: transform 160ms var(--ease), border-color 160ms ease, background-color 160ms ease, color 160ms ease; }
  .mode svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .mode.on { border-color: var(--gold); background: #1E1A12; color: var(--text); } .mode.on svg { stroke: var(--gold); }
  .opt { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; transition: transform 160ms var(--ease), border-color 160ms ease, background-color 160ms ease; text-align: left; width: 100%; }
  .opt.on { border-color: var(--gold); background: #1E1A12; }
  .opt b { display: block; font-size: 14.5px; } .opt span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .opt .pr { margin-left: auto; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .opt .ic { font-size: 22px; width: 32px; text-align: center; }
  .step { display: flex; align-items: center; gap: 12px; }
  .step button { width: 40px; height: 40px; border-radius: 50%; background: var(--panel3); border: 1px solid var(--line2); font-size: 20px; color: var(--text); display: grid; place-items: center; }
  .step b { font-size: 20px; min-width: 24px; text-align: center; }
  .sum { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  .sum:last-child { border-bottom: 0; } .sum span:first-child { color: var(--muted); }
  .sum.total { font-size: 17px; font-weight: 800; padding-top: 10px; }
  details.more { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-top: 12px; }
  details.more summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13.5px; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary .chev { transition: transform 200ms var(--ease); color: var(--muted); } details.more[open] summary .chev { transform: rotate(180deg); }
  details.more .body { padding: 0 14px 14px 14px; border-top: 1px solid var(--line); }
  .stop { display: flex; gap: 8px; align-items: center; margin-top: 8px; } .stop select { flex: 1; } .stop .x { width: 36px; height: 36px; border-radius: 10px; background: var(--panel3); border: 1px solid var(--line2); color: var(--muted); display: grid; place-items: center; flex: 0 0 36px; }
  .applebtn { width: 100%; background: #fff; color: #111; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform 160ms var(--ease); }
  .zellebtn { width: 100%; background: #6D1ED4; color: #fff; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 160ms var(--ease); }
  .linkbtn { background: none; color: var(--muted); font-weight: 700; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 10px; }
  .pay { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; width: 100%; text-align: left; transition: transform 160ms var(--ease), border-color 160ms ease; }
  .pay .lg { width: 44px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 11px; background: #fff; color: #111; flex: 0 0 44px; }
  .trip { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; width: 100%; text-align: left; transition: transform 160ms var(--ease); }
  .trip .dt { text-align: center; min-width: 46px; } .trip .dt b { display: block; font-size: 20px; line-height: 1; } .trip .dt span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .trip .rt { flex: 1; min-width: 0; } .trip .rt b { display: block; font-size: 14px; } .trip .rt span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mapwrap { position: relative; height: 46vh; min-height: 300px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 12px; }
  .mapwrap.mini { height: 170px; min-height: 170px; margin: 10px 0 0 0; }
  .etacard { background: rgba(11,11,12,.9); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-width: 0; }
  .etacard b { display: block; font-size: 19px; line-height: 1.1; letter-spacing: -.02em; } .etacard div > span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; } .etacard > .avatar { flex: 0 0 40px; width: 40px; height: 40px; }
  .mapwrap .eta { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 500; }
  .mapwrap .demo, #side .demo { position: absolute; right: 12px; top: 12px; z-index: 500; }
  #side .demo { right: 24px; top: 24px; }
  .timeline { display: flex; gap: 4px; margin: 10px 0; } .timeline i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); } .timeline i.on { background: var(--ok); }
  .drv { display: flex; align-items: center; gap: 12px; }
  .drv .avatar { width: 48px; height: 48px; flex: 0 0 48px; font-size: 16px; }
  .plate { display: inline-block; font-family: var(--sans); font-weight: 800; letter-spacing: .12em; background: #F4F1EC; color: #111; border-radius: 6px; padding: 3px 8px; font-size: 12px; border: 2px solid #999; }
  .faceid { width: 88px; height: 88px; border-radius: 22px; border: 3px solid var(--gold); margin: 14px auto; display: grid; place-items: center; font-size: 40px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .7; } }
  .ok-big { width: 78px; height: 78px; border-radius: 50%; background: var(--ok); color: #06140C; display: grid; place-items: center; font-size: 40px; margin: 6px auto 14px auto; animation: pop 260ms var(--ease) both; }
  .star { font-size: 30px; color: var(--line2); transition: transform 160ms var(--ease), color 120ms ease; } .star.on { color: var(--gold); }
  .friend { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); } .friend:last-child { border-bottom: 0; }
  .friend .nm { flex: 1; min-width: 0; } .friend .nm b { display: block; font-size: 14px; } .friend .nm span { display: block; font-size: 11.5px; color: var(--muted); }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel3); font-size: 12px; font-weight: 600; margin: 0 6px 6px 0; transition: transform 160ms var(--ease), border-color 160ms ease; }
  .fchip.on { border-color: var(--gold); background: #2A2210; } .fchip .avatar { width: 22px; height: 22px; flex: 0 0 22px; font-size: 9px; }
  /* explorar */
  .cats { display: flex; gap: 6px; margin-bottom: 12px; }
  .cats button { flex: 1; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-weight: 700; font-size: 12px; transition: transform 160ms var(--ease), border-color 160ms ease, color 160ms ease; }
  .cats button.on { border-color: var(--gold); color: var(--text); background: #1E1A12; }
  .sug { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; transition: transform 160ms var(--ease), border-color 160ms ease; }
  .sug .ph { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; border: 1px solid var(--line2); }
  .sug h4 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; } .sug .tg { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 3px; }
  .sug p { margin: 4px 0 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .sug .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .sug .acts .btn { padding: 8px 11px; font-size: 12px; border-radius: 10px; }
  .sug.on { border-color: var(--gold); }
  /* itinerario */
  .day { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); } .day:last-child { border-bottom: 0; }
  .day .d { text-align: center; } .day .d b { display: block; font-size: 18px; line-height: 1; } .day .d span { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .day .ev { font-size: 13px; padding: 4px 0; display: flex; justify-content: space-between; gap: 10px; } .day .ev span { color: var(--muted); font-size: 12px; }
  .stay { background: linear-gradient(160deg, #2A1F0C, #1A1408); border: 1px solid #4A3814; border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .stay .row b { font-size: 15px; }
  .act { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); } .act:last-child { border-bottom: 0; }
  .act .ph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: 0 0 40px; border: 1px solid var(--line2); }
  .act .nm { flex: 1; min-width: 0; } .act .nm b { display: block; font-size: 13.5px; } .act .nm span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .act input.txt { width: auto; padding: 8px 9px; font-size: 12px; border-radius: 9px; }
  .conf h2 { font-weight: 500; font-size: 28px; text-align: center; letter-spacing: -.03em; }
  .conf p.lead { text-align: center; color: var(--muted); margin: 6px 0 16px 0; }
  .track { max-width: 560px; margin: 0 auto; padding: 16px 18px 40px 18px; } .track .mapwrap { height: 56vh; }
  .demo-note { font-size: 10.5px; color: var(--dim); line-height: 1.45; margin-top: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  html[data-device="mobile"] .grid3 { grid-template-columns: 1fr 1fr; } html[data-device="mobile"] .grid3 > :nth-child(3) { grid-column: 1 / -1; }
  @media (hover: hover) { .opt:hover, .pay:hover, .trip:hover, .sug:hover, .mode:hover { border-color: var(--line2); } }
  @media (max-width: 380px) { .mode { font-size: 9px; } .hero h1 { font-size: 26px; } }
</style>

<body>
<div id="app"><div id="panel"><div id="root"></div><nav id="nav"></nav></div><div id="side"><div class="map" id="sideMap"></div><div class="over" id="sideOver"></div></div></div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="../shared/vendor/leaflet.min.js"></script>
<script src="../shared/rutas.js?v=5"></script>
<script src="../shared/core.js?v=5"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const A = window.ACS; const usd = A.usd; const hoy = A.hoy();
  const qs = new URLSearchParams(location.search); if (qs.get('user')) sessionStorage.setItem('acs_user', qs.get('user'));
  let userId = sessionStorage.getItem('acs_user') || 'c1';
  const user = () => A.cliente(userId) || A.db.clientes[0];
  const desktop = () => document.documentElement.dataset.device === 'desktop';
  let view = location.hash.replace('#', '') || 'book'; let sel = { tripId: null, stars: 0, list: false, cat: 'restaurant', sug: null };
  let map = null, layers = {}; let side = null, sideLayers = []; let toastT = null;
  function toast(m) { const t = $('#toast'); t.innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', 2800); }
  function sheet(html) { $('#overlay').innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet">${html}</div></div>`; $('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); }); const c = $('#cls'); if (c) c.onclick = closeSheet; }
  function closeSheet() { $('#overlay').innerHTML = ''; window.__chatViaje = null; }
  const ini = (n) => String(n || '?').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
  const lugarN = (id) => { const l = A.lugar(id); return l ? (l.corto || l.nombre) : '—'; };
  const first = (n) => String(n || '').split(' ')[0];
  const done = (v) => ['completado', 'cancelado', 'no_show'].includes(v.estado);
  const amigos = () => (user().amigos || []).map(id => A.cliente(id)).filter(Boolean);
  const hotelDe = (u) => { const it = A.itinerariosDe(u.id)[0]; if (it) return it.hotelId; const v = A.db.viajes.filter(x => x.clienteId === u.id && x.destinoId !== 'sjd').slice(-1)[0]; return v ? v.destinoId : 'oo'; };
  // ?demo=now: un viaje inmediato para enseñar el mapa en vivo sin llenar el formulario
  if (qs.get('demo') === 'now' && !A.db.viajes.some(v => v.clienteId === userId && A.EN_RUTA.includes(v.estado))) { const v0 = A.solicitarViaje({ clienteId: userId, fecha: hoy, hora: A.ahoraHM(), asap: true, origenId: 'sjd', destinoId: 'oo', vehiculo: 'escalade', pasajeros: 4, maletas: 4, extras: ['super', 'cervezas'], canal: 'app', pago: { metodo: 'applepay', estado: 'aprobado' } }); sel.tripId = v0.id; view = 'trips'; }

  const ICO = {
    book: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    trips: '<svg viewBox="0 0 24 24"><path d="M3 17l3-8h12l3 8M5 17h14v3H5zM7 13h10"/></svg>',
    explore: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-4 2 2-6z"/></svg>',
    friends: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.8"/><path d="M2.5 20c.5-4 3.5-6 6.5-6s6 2 6.5 6M15 14.5c2.8 0 5.5 1.6 6 5.5"/></svg>',
    account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg>',
    plane: '<svg viewBox="0 0 24 24"><path d="M2 16l20-8-4 8 4 4-6-2-3 3-2-6z"/></svg>',
    planeUp: '<svg viewBox="0 0 24 24"><path d="M3 21h18M4 14l7-2 6-8 3 1-4 8 5 2v2L4 15z"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    stay: '<svg viewBox="0 0 24 24"><path d="M3 20V9l9-5 9 5v11"/><path d="M9 20v-6h6v6"/></svg>',
  };
  const NAV = [['book', 'Book'], ['trips', 'Trips'], ['explore', 'Explore'], ['friends', 'Friends'], ['account', 'Account']];
  const pendientesAmigos = () => A.db.invitaciones.filter(i => i.para === userId && i.estado === 'pendiente').length + A.viajesCompartidosCon(userId).filter(v => v.partes && v.partes[userId] && v.partes[userId].estado !== 'pagado' && !done(v)).length;
  function renderNav() { const n = pendientesAmigos(); $('#nav').innerHTML = NAV.map(([id, l]) => `<button class="tab ${view === id || (view === 'stay' && id === 'book') ? 'on' : ''}" data-v="${id}">${ICO[id]}<span>${l}</span>${id === 'friends' && n ? `<i class="n">${n}</i>` : ''}</button>`).join(''); $$('#nav [data-v]').forEach(b => b.onclick = () => go(b.dataset.v)); }

    if (view === 'explore') { const m = nuevoMapa(el); const pts = []; sugs(sel.cat).forEach(s => { const l = A.lugar(s.lugarId); if (!l) return; pts.push(l.pos); const mk = L.marker(l.pos, { icon: L.divIcon({ className: 'mk', html: `<div style="position:relative;"><div class="mk-pin ${sel.sug === s.id ? 'dest' : ''}"></div><div class="mk-lbl">${esc(s.nombre)}</div></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(m); mk.on('click', () => { sel.sug = s.id; render(); }); }); if (pts.length) m.fitBounds(L.latLngBounds(pts), { padding: [70, 70] }); return; }
    const m = nuevoMapa(el); const u = user(); const h = A.lugar(hotelDe(u)); const pts = [h.pos, A.lugar('sjd').pos]; L.marker(h.pos, { icon: pinIcon(true, h.corto || h.nombre) }).addTo(m); L.marker(A.lugar('sjd').pos, { icon: pinIcon(false, 'SJD Airport') }).addTo(m); A.db.choferes.filter(c => c.enLinea).forEach(c => { L.marker(c.pos, { icon: icono('mk-car' + (A.viajeActivo(c.id) ? ' busy' : ''), '🚘') }).addTo(m); }); m.fitBounds(L.latLngBounds(pts), { padding: [80, 80] });
  }

  // ═════════════ EXPLORE ═════════════
  function vExplore() {
    const u = user(); const its = A.itinerariosDe(u.id).filter(it => it.salida.fecha >= hoy); const lista = sugs(sel.cat);
    layout(`<main><div class="hero"><h1>The best of <em>Los Cabos.</em></h1><p>Hand-picked by All Cabo Services. Book the ride there in one tap, or add it to your stay.</p></div>
      <div class="cats">${[['restaurant', 'Restaurants'], ['activity', 'Things to do'], ['hotel', 'Hotels']].map(([id, l]) => `<button class="${sel.cat === id ? 'on' : ''}" data-cat="${id}">${l}</button>`).join('')}</div>
      ${lista.map(s => `<div class="sug ${sel.sug === s.id ? 'on' : ''}" data-sug="${s.id}"><span class="ph" style="background:${s.color}">${s.icono}</span><div><div class="tg">${esc(s.tagline)}</div><h4>${esc(s.nombre)}</h4><p>${esc(s.desc)}${s.cuando ? ` <span class="dim">· ${esc(s.cuando)}</span>` : ''}</p><div class="acts">${s.cat === 'hotel' ? `<button class="btn sm" data-ride="${s.lugarId}">Ride from the airport</button>` : `<button class="btn sm" data-ride="${s.lugarId}">Ride there</button>${its.length ? `<button class="btn sm sec" data-addstay="${s.id}">+ Add to my stay</button>` : `<button class="btn sm sec" data-plan="${s.id}">Plan a stay</button>`}`}<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.nombre + ' Los Cabos')}">Map</a></div></div></div>`).join('')}
      <p class="demo-note">Recommendations are curated by All Cabo Services and updated from the operations center. Reservations at the venue are arranged by your host driver on request.</p></main>`);
    $$('[data-cat]').forEach(b => b.onclick = () => { sel.cat = b.dataset.cat; sel.sug = null; render(); });
    $$('[data-sug]').forEach(d => d.onclick = (e) => { if (e.target.closest('.acts')) return; sel.sug = d.dataset.sug; sideUpdate(); $$('[data-sug]').forEach(x => x.classList.toggle('on', x.dataset.sug === sel.sug)); });
    $$('[data-ride]').forEach(b => b.onclick = () => { const l = A.lugar(b.dataset.ride); if (l.tipo === 'hotel') { B.modo = 'from_airport'; B.origenId = 'sjd'; B.destinoId = l.id; B.cuando = 'schedule'; } else { B.modo = 'between'; B.origenId = hotelDe(u); B.destinoId = l.id; B.cuando = 'schedule'; B.hora = '18:30'; } B.paso = 1; go('book'); });
    $$('[data-plan]').forEach(b => b.onclick = () => { const s = A.sugerencia(b.dataset.plan); B.modo = 'stay'; S.paso = 2; if (!S.actividades.some(a => a.sugerenciaId === s.id)) S.actividades.push({ sugerenciaId: s.id, fecha: A.sumaDias(S.llegadaFecha, 1), hora: s.cat === 'restaurant' ? '18:30' : '09:00', esperar: s.cat === 'restaurant', horas: s.duracion || 3 }); go('book'); });
    $$('[data-addstay]').forEach(b => b.onclick = () => { const s = A.sugerencia(b.dataset.addstay); const it = its[0]; const dias = Array.from({ length: it.noches }, (_, i) => A.sumaDias(it.llegada.fecha, i + 1)); sheet(`<div class="row"><h3>Add to your stay</h3><button class="btn sec sm" id="cls">Close</button></div><div class="act" style="border:0;"><span class="ph" style="background:${s.color}">${s.icono}</span><div class="nm"><b>${esc(s.nombre)}</b><span>${esc(s.tagline)}</span></div></div><div class="grid2"><div><label class="lbl">Day</label><select class="txt" id="adDia">${dias.map(d => `<option value="${d}">${A.fechaLarga(d, true).replace(', 2026', '')}</option>`).join('')}</select></div><div><label class="lbl">Time</label><input class="txt" type="time" id="adHora" value="${s.cat === 'restaurant' ? '18:30' : '09:00'}"></div></div><label class="lbl">Your driver</label><div class="seg" style="display:flex;"><button class="on" data-esp="1" style="flex:1;">Waits for you · ${s.duracion || 3} h</button><button data-esp="0" style="flex:1;">Drops off & comes back</button></div><button class="btn xl full" id="adGo" style="margin-top:14px;">Add ride</button>`); let esperar = true; $$('[data-esp]').forEach(x => x.onclick = () => { esperar = x.dataset.esp === '1'; $$('[data-esp]').forEach(y => y.classList.toggle('on', y === x)); }); $('#adGo').onclick = () => { const fecha = $('#adDia').value, hora = $('#adHora').value || '18:30'; const dur = s.duracion || 3; const v = A.solicitarViaje({ clienteId: userId, fecha, hora, origenId: it.hotelId, destinoId: s.lugarId, modo: esperar ? 'horas' : 'redondo', horas: dur, regresoHora: esperar ? null : A.hmDe(A.minutosDe(hora) + dur * 60), vehiculo: it.vehiculo, pasajeros: it.pax, maletas: 0, extras: [], notas: esperar ? `Driver waits · ${dur} h` : 'Pickup back at ' + A.hora12(A.hmDe(A.minutosDe(hora) + dur * 60)), canal: 'app', itinerarioId: it.id, pago: { ...it.pago, ref: '' } }); v.etiqueta = s.nombre; it.viajeIds.push(v.id); it.total += v.precio.total; it.actividades.push({ sugerenciaId: s.id, fecha, hora, esperar, horas: dur }); A.save(); closeSheet(); toast(`${s.nombre} added · ${usd(v.precio.total)} charged to your ${A.METODOS[it.pago.metodo].en}`); sel.tripId = null; sel.list = true; go('trips'); }; });
    sideUpdate();
  }

  // ═════════════ FRIENDS ═════════════
  function vFriends() {
    const u = user(); const am = amigos(); const inv = A.db.invitaciones.filter(i => i.para === u.id && i.estado === 'pendiente'); const enviadas = A.db.invitaciones.filter(i => i.de === u.id && i.estado === 'pendiente');
    const conmigo = A.viajesCompartidosCon(u.id).filter(v => !done(v)); const mios = misViajes().filter(v => (v.compartidoCon || []).length && !done(v));
    layout(`<main><div class="hero"><h1>Friends & <em>family.</em></h1><p>Share a live trip so they know where you are, or split the fare so everyone pays their part.</p></div>
      <div class="card"><h3>Add a friend</h3><div class="row"><input class="txt" id="fInv" placeholder="Email, phone or name"><button class="btn" id="fGo">Invite</button></div><div class="tiny muted" style="margin-top:6px;">They get a link to All Cabo; once they accept, you can share rides and split fares. Demo: try «emily.chen@mail.com».</div></div>
      ${inv.length ? `<div class="card gold" style="margin-top:10px;"><h3>Invitations</h3>${inv.map(i => { const c = A.cliente(i.de); return `<div class="friend"><span class="avatar">${ini(c.nombre)}</span><div class="nm"><b>${esc(c.nombre)}</b><span>${esc(c.ciudad)} · wants to share rides with you</span></div><button class="btn sm" data-acc="${i.id}">Accept</button></div>`; }).join('')}</div>` : ''}
      <div class="card" style="margin-top:10px;"><h3>Your circle <span>· ${am.length}</span></h3>${am.map(a => `<div class="friend"><span class="avatar">${ini(a.nombre)}</span><div class="nm"><b>${esc(a.nombre)}</b><span>${esc(a.ciudad)} · ${a.visitas} trips with us</span></div><button class="btn sm sec" data-book="${a.id}">Book together</button></div>`).join('') || '<div class="small muted">No friends yet. Invite someone above.</div>'}${enviadas.length ? `<div class="tiny muted" style="margin-top:8px;">Pending: ${enviadas.map(i => esc(i.contacto)).join(', ')}</div>` : ''}</div>
      ${conmigo.length ? `<h3 class="eyebrow" style="margin:16px 0 8px 0;">Shared with you</h3>${conmigo.map(v => cardViaje(v, v.partes && v.partes[u.id] ? `<span class="pill ${v.partes[u.id].estado === 'pagado' ? 'ok' : 'warn'}">Your share ${usd(v.partes[u.id].monto)} · ${v.partes[u.id].estado === 'pagado' ? 'paid' : 'to pay'}</span> ` : `<span class="pill info">by ${esc(first(v.nombre))}</span> `)).join('')}` : ''}
      ${mios.length ? `<h3 class="eyebrow" style="margin:16px 0 8px 0;">Your rides shared with friends</h3>${mios.map(v => cardViaje(v, `<span class="pill info">${v.compartidoCon.map(id => esc(first((A.cliente(id) || {}).nombre || ''))).join(', ')}</span> `)).join('')}` : ''}
      <div class="card" style="margin-top:14px;"><h3>Safety first</h3><div class="small muted">Every ride has a live link with the car on the map, the driver's name and the plate. Share it with anyone from the trip screen; no account needed on their side.</div></div></main>`);
    $('#fGo').onclick = () => { const r = A.invitarAmigo(u.id, $('#fInv').value); toast(r.estado === 'agregado' ? `${r.cliente.nombre} is now in your circle` : 'Invitation sent (simulated)'); render(); }; $('#fInv').onkeydown = (e) => { if (e.key === 'Enter') $('#fGo').click(); };
    $$('[data-acc]').forEach(b => b.onclick = () => { A.aceptarInvitacion(b.dataset.acc); toast('Friend added'); render(); });
    $$('[data-book]').forEach(b => b.onclick = () => { B.split = true; B.splitCon = [b.dataset.book]; B.modo = 'between'; B.origenId = hotelDe(u); B.destinoId = 'ff'; B.cuando = 'schedule'; B.hora = '18:30'; B.paso = 1; go('book'); toast('Fare will be split with ' + first((A.cliente(b.dataset.book) || {}).nombre || '')); });
    $$('[data-t]').forEach(b => b.onclick = () => { sel.tripId = b.dataset.t; go('trips'); });
    sideUpdate();
  }

  // ═════════════ ACCOUNT ═════════════
  function vAccount() {
    const u = user(); const cta = u.cuentaId ? A.db.cuentas.find(x => x.id === u.cuentaId) : null; const vs = misViajes().filter(v => v.estado === 'completado');
    layout(`<main><div class="hero"><h1>${esc(first(u.nombre))}'s <em>account.</em></h1><p>${esc(u.ciudad)} · ${u.visitas} trips with us${u.vip ? ' · <span class="pill gold">VIP guest</span>' : ''}</p></div>
      <div class="card"><h3>Profile</h3><div class="kv"><span>Name</span><span>${esc(u.nombre)}</span></div><div class="kv"><span>Phone</span><span>${esc(u.tel)}</span></div><div class="kv"><span>Email</span><span>${esc(u.email)}</span></div><div class="kv"><span>Usual hotel</span><span>${esc(lugarN(hotelDe(u)))}</span></div><div class="kv"><span>Preferences</span><span style="text-align:right;">${esc(u.preferencias || 'None yet')}</span></div></div>
      <div class="card" style="margin-top:10px;"><h3>Payment</h3><div class="kv"><span> Pay</span><span class="pill ok">Default</span></div><div class="kv"><span>Zelle</span><span>${esc(u.email)}</span></div><div class="kv"><span>Visa •••• 4242</span><span>Exp 09/28</span></div></div>
      ${cta ? `<div class="card gold" style="margin-top:10px;"><h3>${esc(cta.tipo)} account</h3><b style="font-size:15px;">${esc(cta.nombre)}</b><div class="small muted" style="margin-top:4px;">Coordinator ${esc(cta.contacto)} · one monthly invoice. Your rides are billed to the account.</div></div>` : ''}
      <div class="card" style="margin-top:10px;"><h3>With All Cabo Services</h3><div class="row"><span class="muted small">${vs.length} completed rides</span><b style="font-size:20px;">${usd(u.gasto)}</b></div><div class="small muted" style="margin-top:6px;">Receipts per trip by email. Add this app to your home screen for one-tap booking.</div></div>
      <div class="card" style="margin-top:10px;"><h3>Demo controls</h3><div class="grid2"><button class="btn sec sm" id="acDev">${desktop() ? 'Phone layout' : 'Desktop layout'}</button><button class="btn ghost sm" id="acReset">Reset demo data</button></div><div class="tiny muted" style="margin-top:6px;">The app detects the device on its own; this switch is only to preview both layouts.</div></div>
      <p class="demo-note">Demo data lives in this browser only. Payments, WhatsApp and emails are simulated.</p></main>`);
    $('#acDev').onclick = () => { A.fijarDispositivo(desktop() ? 'mobile' : 'desktop'); render(); }; $('#acReset').onclick = () => { if (confirm('Reset all demo data in this browser?')) { A.reset(); render(); } };
    sideUpdate();
  }

  // ═════════════ TRACK (enlace público de seguimiento) ═════════════
  function vTrack(v) {
    const c = v.choferId ? A.chofer(v.choferId) : null; const veh = c ? A.vehiculo(c.vehiculoId) : null; const [t1, t2] = etaLineas(v);
    $('#nav').style.display = 'none'; document.documentElement.dataset.device = 'mobile'; $('#panel').style.maxWidth = '560px';
    $('#root').innerHTML = `<div class="track"><div class="top" style="padding-left:0;padding-right:0;"><img src="../shared/img/logo.png" alt="All Cabo Services" style="height:26px;"><span class="pill gold">Live trip</span></div>
      <div class="mapwrap"><div id="map" class="map"></div><div class="eta etacard"><div><b>${esc(t1)}</b><span>${esc(t2)}</span></div>${c ? `<span class="avatar">${ini(c.nombre)}</span>` : ''}</div></div>
      <div class="card"><b style="font-size:15px;">${esc(first(v.nombre))}'s ride · ${esc(lugarN(v.origenId))} → ${esc(lugarN(v.destinoId))}</b><div class="small muted" style="margin-top:4px;">${A.fechaLarga(v.fecha, true)} · pickup ${A.hora12(v.hora)} · <span class="pill" style="color:${A.ESTADOS[v.estado].color}">${esc(A.ESTADOS[v.estado].en)}</span></div>${c ? `<div class="drv" style="margin-top:12px;"><div class="avatar">${ini(c.nombre)}</div><div style="flex:1;"><b>${esc(c.nombre)}</b><div class="small muted">${esc(A.TIPOS_VEHICULO[veh.tipo].nombre)} · ${esc(veh.color)}</div></div><span class="plate">${esc(veh.placa)}</span></div>` : ''}</div>
      <p class="demo-note">Shared by ${esc(v.nombre)} through All Cabo Services. This page shows the vehicle position, driver and plate only.</p></div>`;
    dibujarMapa(v, $('#map'));
  }

  // ═════════════ render + eventos ═════════════
  function render() {
    if (map) { map.remove(); map = null; } layers = {};
    const track = qs.get('track'); if (track && A.viaje(track)) { vTrack(A.viaje(track)); return; }
    if (view === 'stay') { view = 'book'; B.modo = 'stay'; }
    ({ book: vBook, trips: vTrips, explore: vExplore, friends: vFriends, account: vAccount }[view] || vBook)(); renderNav();
    if (!desktop() && side) { side.remove(); side = null; }
  }
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v && v !== view) { view = v; render(); } });
  window.addEventListener('resize', () => { const d = document.documentElement.dataset.device; clearTimeout(window.__rz); window.__rz = setTimeout(() => { if (document.documentElement.dataset.device !== d) render(); }, 150); });
  A.on((motivo) => { if (motivo === 'sim') { actualizarMapa(); return; } if ($('#sheetBg')) { if (window.__chatViaje && $('#chatBox')) { const ms = A.mensajesDe(window.__chatViaje); $('#chatBox').innerHTML = ms.map(m => `<div class="cb ${m.de === 'cliente' ? 'me' : 'them'}">${esc(m.texto)}<time>${new Date(m.t).toTimeString().slice(0, 5)}</time></div>`).join(''); $('#chatBox').scrollTop = 1e6; } return; } if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return; render(); });
  A.onEvento((ev) => { const v = ev.viajeId ? A.viaje(ev.viajeId) : null; if (!v) return; if (ev.tipo === 'compartido' && ev.para === userId) { toast(`${first(v.nombre)} shared a ride with you`); return; } if (v.clienteId !== userId && !(v.compartidoCon || []).includes(userId)) return; if (ev.tipo === 'viaje_asignado') toast(`${A.chofer(ev.choferId).nombre} is your driver`); if (ev.tipo === 'estado') toast({ en_camino: 'Your driver is on the way', llegue: 'Your driver has arrived' + (v.origenId === 'sjd' ? ' · Door 3' : ''), a_bordo: 'Enjoy the ride!', completado: 'Trip completed · receipt sent', cancelado: 'Trip cancelled' }[ev.estado] || ''); if (ev.tipo === 'mensaje' && ev.de === 'chofer') toast('New message from your driver'); if (ev.tipo === 'llegada' && ev.fase === 'a_recoger') toast('Your driver is arriving now'); });
  render();
})();
</script>
