  // ═════════════ FLOTA · CHOFERES · GASTOS ═════════════
  function vFlota() {
    const alertas = A.M.alertasFlota(); const dias = (iso) => Math.round((new Date(iso) - new Date(hoy)) / 86400000); const pv = A.M.porVehiculo(90);
    const stk = (v) => { const falta = v.ultimoServicioKm + v.servicioCadaKm - v.km; const p = Math.max(0, Math.min(100, (v.km - v.ultimoServicioKm) / v.servicioCadaKm * 100)); const cls = falta <= 0 ? 'bad' : falta <= 1500 ? 'warn' : 'ok'; return `<div class="stk"><div class="bar"><i class="${cls}" style="width:${p.toFixed(0)}%"></i></div><span class="v">${falta <= 0 ? 'vencido' : falta.toLocaleString('es-MX') + ' km'}</span></div>`; };
    const venc = (iso) => { const d = dias(iso); return `<span class="pill ${d <= 14 ? 'bad' : d <= 30 ? 'warn' : 'ok'}">${esc(iso)} · ${d} d</span>`; };
    shell(`<div class="kgrid">${kpi({ icon: 'fleet', label: 'Vehículos', value: A.db.vehiculos.length, sub: `${A.db.vehiculos.filter(v => v.tipo === 'suburban').length} Suburban · ${A.db.vehiculos.filter(v => v.tipo === 'escalade').length} Escalade · ${A.db.vehiculos.filter(v => v.tipo === 'hiace').length} Hiace · ${A.db.vehiculos.filter(v => v.tipo === 'sprinter').length} Sprinter` })}${kpi({ icon: 'bell', label: 'Alertas', value: alertas.length, cls: alertas.some(a => a.nivel === 'bad') ? 'amber' : 'good', sub: 'seguros, permisos, servicios, licencias' })}${kpi({ icon: 'road', label: 'Km en 90 días', value: pv.reduce((a, x) => a + x.km, 0).toLocaleString('es-MX'), sub: 'toda la flota' })}${kpi({ icon: 'money', label: 'Ingreso por vehículo', value: usd(pv.reduce((a, x) => a + x.ingreso, 0) / A.db.vehiculos.length), sub: 'promedio · 90 días' })}</div>
      <div class="grid g32"><div class="card"><h3>Vehículos <span>· seguro, permiso de transporte y servicio por kilometraje</span></h3><div style="overflow-x:auto;"><table><thead><tr><th>Vehículo</th><th class="num">Km</th><th>Próximo servicio</th><th>Seguro</th><th>Permiso</th><th class="num">Viajes 90 d</th></tr></thead><tbody>${A.db.vehiculos.map(v => { const t = A.TIPOS_VEHICULO[v.tipo]; const x = pv.find(y => y.vehiculo.id === v.id); const c = A.db.choferes.find(ch => ch.vehiculoId === v.id); return `<tr><td class="nw"><b>${esc(t.nombre)} ${v.anio}</b><br><span class="small muted"><span class="plate">${esc(v.placa)}</span> ${c ? '· ' + esc(c.nombre.split(' ')[0]) : ''}</span></td><td class="num">${v.km.toLocaleString('es-MX')}</td><td>${stk(v)}</td><td>${venc(v.seguroVence)}</td><td>${venc(v.permisoVence)}</td><td class="num">${x ? x.viajes : 0} · ${usd(x ? x.ingreso : 0)}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div><div class="card"><h3>Alertas de cumplimiento</h3>${alertas.map(a => `<div class="alert"><i style="background:${a.nivel === 'bad' ? 'var(--bad)' : 'var(--warn)'}"></i><span>${esc(a.texto)}</span></div>`).join('') || '<div class="muted small">Todo al día.</div>'}</div><div class="card" style="margin-top:12px;"><h3>Documentos por vehículo</h3><div class="small muted">Póliza, tarjeta de circulación, permiso estatal de transporte turístico y verificación, con vencimiento y aviso 30 días antes. En el demo solo las fechas.</div><button class="btn sec sm" style="margin-top:8px;" id="fIncid">Registrar incidente</button></div></div></div>`, 'Flota y cumplimiento', 'Ninguna camioneta sale con el seguro vencido');
    $('#fIncid').onclick = () => toast('Incidente registrado (simulado)');
  }
  function vChoferes() {
    const pc = A.M.porChofer(30);
    shell(`<div class="kgrid">${kpi({ icon: 'user', label: 'Choferes', value: A.db.choferes.length, sub: `${A.db.choferes.filter(c => c.enLinea).length} en línea ahora` })}${kpi({ icon: 'trips', label: 'Viajes 30 días', value: pc.reduce((a, x) => a + x.viajes, 0), sub: 'completados por el equipo' })}${kpi({ icon: 'money', label: 'Pago a choferes', value: mxn(pc.reduce((a, x) => a + x.pagoMXN, 0)).replace(' MXN', ''), sub: `30 días · ${Math.round(A.db.config.pagoChoferPct * 100)}% del viaje (configurable)` })}${kpi({ icon: 'star', label: 'Calificación', value: (A.db.choferes.reduce((a, c) => a + c.calificacion, 0) / A.db.choferes.length).toFixed(2), cls: 'good', sub: 'promedio del equipo' })}</div>
      <div class="card" style="margin-top:12px;"><h3>Equipo</h3><div style="overflow-x:auto;"><table><thead><tr><th>Chofer</th><th>Vehículo</th><th>Estado</th><th class="num">Hoy</th><th class="num">30 días</th><th class="num">Pago 30 d</th><th>Calif.</th><th>Licencia</th><th>Checklist hoy</th><th></th></tr></thead><tbody>${pc.map(x => { const c = x.chofer; const veh = A.vehiculo(c.vehiculoId); const va = A.viajeActivo(c.id); const ck = A.db.checklists.find(k => k.choferId === c.id && k.fecha === hoy); const dl = Math.round((new Date(c.licenciaVence) - new Date(hoy)) / 86400000); return `<tr><td class="nw"><b>${esc(c.nombre)}</b><br><span class="small muted">desde ${c.ingreso} · ${esc(c.idiomas)} · ${esc(c.tel)}</span></td><td class="small">${esc(A.TIPOS_VEHICULO[veh.tipo].corto)} <span class="plate">${esc(veh.placa)}</span></td><td>${va ? '<span class="pill info">en viaje</span>' : c.enLinea ? '<span class="pill ok">en línea' + (c.checkin ? ' · ' + esc(c.checkin) : '') + '</span>' : '<span class="pill">fuera</span>'}</td><td class="num">${x.hoy}</td><td class="num">${x.viajes}</td><td class="num">${mxn(x.pagoMXN)}</td><td><span class="stars">★</span> ${c.calificacion.toFixed(1)}</td><td><span class="pill ${dl <= 30 ? 'bad' : dl <= 60 ? 'warn' : 'ok'}">${esc(c.licenciaVence)}</span></td><td>${ck ? '<span class="pill ok">✓ ' + esc(ck.hora) + '</span>' : '<span class="pill warn">pendiente</span>'}</td><td><button class="btn sec sm" data-on="${c.id}">${c.enLinea ? 'Poner fuera' : 'Poner en línea'}</button></td></tr>`; }).join('')}</tbody></table></div></div>`, 'Choferes', 'Quién está en línea, quién trae qué y cuánto se le paga');
    $$('[data-on]').forEach(b => b.onclick = () => { const c = A.chofer(b.dataset.on); A.setEnLinea(c.id, !c.enLinea); render(); });
  }
  function vGastos() {
    const g = A.M.gastosMes(); const desde = A.sumaDias(hoy, -30); const gs = A.db.gastos.filter(x => x.fecha >= desde).sort((a, b) => (b.fecha + (b.hora || '')) < (a.fecha + (a.hora || '')) ? -1 : 1);
    shell(`<div class="kgrid">${kpi({ icon: 'fuel', label: 'Gastos 30 días', value: mxn(g.total).replace(' MXN', ''), sub: `${g.n} registros con foto` })}${Object.entries(g.por).slice(0, 3).map(([t, m]) => kpi({ icon: t === 'gasolina' ? 'fuel' : 'receipt', label: t, value: mxn(m).replace(' MXN', ''), sub: pct(m / Math.max(1, g.total) * 100, 0) + ' del total' })).join('')}</div>
      <div class="card" style="margin-top:12px;"><h3>Registros <span>· cada gasto ligado al chofer, al vehículo y al viaje</span></h3><div style="overflow-x:auto;"><table><thead><tr><th>Fecha</th><th>Chofer</th><th>Vehículo</th><th>Tipo</th><th>Viaje</th><th class="num">MXN</th><th>Foto</th></tr></thead><tbody>${gs.slice(0, 30).map(x => { const c = A.chofer(x.choferId); const v = A.vehiculo(x.vehiculoId); const vi = x.viajeId ? A.viaje(x.viajeId) : null; return `<tr><td class="nw">${esc(x.fecha)}${x.hora ? ' ' + esc(x.hora) : ''}</td><td>${c ? esc(c.nombre) : '—'}</td><td class="small">${v ? esc(A.TIPOS_VEHICULO[v.tipo].corto) + ' ' + esc(v.placa) : '—'}</td><td>${esc(x.tipo)}</td><td class="small muted">${vi ? esc(lugarN(vi.origenId)) + ' → ' + esc(lugarN(vi.destinoId)) : '—'}</td><td class="num">${mxn(x.monto)}</td><td>${x.foto ? '📷' : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>`, 'Gastos de operación', 'Gasolina, casetas y lavados con foto, sin libreta');
  }

  // ═════════════ TABLERO ═════════════
  function vTablero() {
    const p = A.M.periodo(30), p2 = A.M.periodo(60); const prev = { ingreso: p2.ingreso - p.ingreso, viajes: p2.viajes - p.viajes }; const dIng = prev.ingreso ? (p.ingreso - prev.ingreso) / prev.ingreso * 100 : null;
    const meses = A.M.porMes(); const zonas = A.M.porZona(90); const can = A.M.porCanal(90); const pv = A.M.porVehiculo(90); const al = A.M.aliados(90); const alertas = A.M.alertasFlota(); const con = A.M.conciliacion(); const h = A.M.hoy(); const mejor = meses.slice().sort((a, b) => b.ingreso - a.ingreso)[0];
    const chips = ['¿Qué zona rinde más?', '¿Cuál es la mejor temporada?', '¿De dónde vienen los viajes?', '¿Qué margen llevamos?', '¿Qué camioneta produce más?', '¿Quién es mi mejor cliente?', '¿Cómo va la flota?', '¿Qué hay pendiente de cobrar?', '¿Cómo vamos hoy?'];
    const html = `<div class="card ia"><div><h3 style="margin-bottom:3px;"><span class="iabadge">IA</span>Asistente de All Cabo <span>· pregúntele a su negocio</span></h3><div class="small muted">Responde en lenguaje normal con los datos del sistema.</div></div><div id="chat" class="chatc" style="max-height:34vh; margin-top:10px;">${(window.__chat || []).map(m => `<div class="cb ${m.me ? 'me' : 'them'}" style="max-width:100%;">${esc(m.t)}</div>`).join('') || '<div class="cb them" style="max-width:100%;">Buenos días. Soy el asistente de All Cabo Services. Puedo decirle qué zona rinde más, cómo va la temporada, de dónde vienen los viajes, qué chofer, qué camioneta y qué aliado producen más, qué hay pendiente de cobrar, cómo está la flota y qué margen llevamos. ¿Qué quiere saber?</div>'}${window.__chatTyping ? '<div class="cb them typing"><i></i><i></i><i></i></div>' : ''}</div><div class="row" style="margin-top:10px;"><input class="txt" id="q" placeholder="Pregunte algo sobre su negocio…"><button class="btn" id="ask">Preguntar</button></div><div class="chips" style="margin-top:8px;">${chips.map(s => `<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="tiny dim" style="margin-top:8px;">Demo: respuestas generadas con los datos de muestra de este navegador.</div></div><div class="kgrid">${kpi({ icon: 'money', label: 'Ingreso 30 días', value: usd(p.ingreso), delta: dIng, sub: `${mxn(p.ingresoMXN)} a ${A.db.config.tipoCambio} · contra los 30 anteriores` })}${kpi({ icon: 'trips', label: 'Viajes 30 días', value: p.viajes, sub: `${p.viajesPorVehiculoDia.toFixed(2)} por camioneta al día` })}${kpi({ icon: 'ticket', label: 'Ticket promedio', value: usd(p.ticket), sub: 'por viaje, sin propina' })}${kpi({ icon: 'chart', label: 'Margen', value: pct(p.margenPct, 0), cls: 'good', sub: `${mxn(p.margenMXN)} tras gasolina, casetas y choferes` })}${kpi({ icon: 'fuel', label: 'Costo por viaje', value: mxn(p.costoViajeMXN).replace(' MXN', ''), sub: 'gasolina + casetas + pago al chofer' })}${kpi({ icon: 'bell', label: 'No-show y cancelación', value: pct(p.noshowPct + p.cancelPct, 1), cls: p.noshowPct + p.cancelPct > 5 ? 'amber' : 'good', sub: `${pct(p.noshowPct, 1)} no-show · ${pct(p.cancelPct, 1)} cancelados` })}</div>
      <div class="grid g32">${chartCard({ id: 'chMeses', title: 'Ingresos por mes', sub: 'temporada alta de diciembre a abril', big: mejor ? mejor.mes + ' · ' + usd(mejor.ingreso) : '—', deltaTxt: 'el mejor mes de los últimos 12', tipo: 'bar', labels: meses.map(m => m.mes), series: [{ label: 'Ingreso USD', data: meses.map(m => m.ingreso), color: '#E4B15C' }], eje: 'Mes', metaRef: p.ingreso, metaLabel: 'Meta de ingreso mensual (USD)', h: 190 })}${chartCard({ id: 'chZona', title: 'Por zona', sub: 'últimos 90 días', big: usd(zonas.reduce((a, z) => a + z.ingreso, 0)), deltaTxt: 'las dos zonas', tipo: 'doughnut', labels: zonas.map(z => z.zona.es), series: [{ label: 'Ingreso', data: zonas.map(z => z.ingreso) }], eje: 'Zona', h: 190 })}</div>
      <div class="grid g3">${chartCard({ id: 'chCanal', title: 'De dónde vienen los viajes', sub: '90 días · por canal', big: can[0] ? can[0].nombre : '—', deltaTxt: can[0] ? usd(can[0].ingreso) + ' · el canal que más deja' : '', tipo: 'bar', horizontal: true, labels: can.map(c => c.nombre), series: [{ label: 'Ingreso', data: can.map(c => c.ingreso), color: '#8FD0FF' }], eje: 'Canal' })}${chartCard({ id: 'chVeh', title: 'Por vehículo', sub: '90 días', big: pv[0] ? A.TIPOS_VEHICULO[pv[0].vehiculo.tipo].corto + ' ' + pv[0].vehiculo.placa : '—', deltaTxt: pv[0] ? usd(pv[0].ingreso) + ' · la que más produce' : '', tipo: 'bar', horizontal: true, labels: pv.map(x => A.TIPOS_VEHICULO[x.vehiculo.tipo].corto + ' ' + x.vehiculo.placa.slice(-5)), series: [{ label: 'Ingreso', data: pv.map(x => x.ingreso), color: '#E4B15C' }], eje: 'Vehículo' })}${chartCard({ id: 'chCosto', title: 'Ingreso contra costo', sub: 'por mes · MXN', big: mxn(p.margenMXN), deltaTxt: 'margen de 30 días', tipo: 'line', labels: meses.map(m => m.mes), series: [{ label: 'Ingreso MXN', data: meses.map(m => m.ingreso * A.db.config.tipoCambio), color: '#E4B15C' }, { label: 'Costo MXN', data: meses.map(m => m.costoMXN), color: '#F2A48B', dash: [4, 4] }], eje: 'Mes', fmt: (v) => mxn(v) })}</div>
      <div class="grid g3">
        <div class="card"><h3>Alertas</h3>${alertas.slice(0, 5).map(a => `<div class="alert"><i style="background:${a.nivel === 'bad' ? 'var(--bad)' : 'var(--warn)'}"></i><span>${esc(a.texto)}</span></div>`).join('')}${h.sinChofer ? `<div class="alert"><i style="background:var(--warn)"></i><span>${h.sinChofer} viaje${h.sinChofer > 1 ? 's' : ''} de hoy sin chofer asignado</span></div>` : ''}${con.pendientes.length ? `<div class="alert"><i style="background:var(--warn)"></i><span>${con.pendientes.length} pagos por confirmar · ${usd(con.pendientes.reduce((a, v) => a + v.precio.total, 0))}</span></div>` : ''}</div>
        <div class="card"><h3>Conciliación de hoy <span>· por método</span></h3>${con.porMetodo.filter(m => m.n).map(m => `<div class="kv"><span>${esc(A.METODOS[m.metodo].es)} · ${m.n}</span><b class="num">${usd(m.total)}</b></div>`).join('')}<h3 style="margin-top:12px;">Por confirmar</h3>${con.pendientes.map(v => `<div class="kv"><span>${esc(v.nombre)} · ${esc(A.METODOS[v.pago.metodo].es)}${v.pago.ref ? ' · ' + esc(v.pago.ref) : ''}</span><span><b class="num">${usd(v.precio.total)}</b> <button class="btn ok sm" data-conf="${v.id}">Confirmar</button></span></div>`).join('') || '<div class="muted small">Nada pendiente.</div>'}</div>
        <div class="card"><h3>Comisiones a aliados <span>· 90 días</span></h3>${al.filter(x => x.comision).slice(0, 5).map(x => `<div class="kv"><span>${esc(x.aliado.nombre)}</span><b class="num">${usd(x.comision)}</b></div>`).join('')}<div class="kv"><span><b>Total</b></span><b class="num">${usd(al.reduce((a, x) => a + x.comision, 0))}</b></div></div>
      </div>
`;
    shell(html, 'Tablero del dueño', 'Ingresos, costo por viaje, margen, temporada, canales y flota · datos ilustrativos');
    $$('[data-conf]').forEach(b => b.onclick = () => { A.confirmarPago(b.dataset.conf); toast('Pago confirmado'); render(); });
    const scrollChat = () => setTimeout(() => { const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; }, 0);
    const ask = () => { const q = $('#q').value.trim(); if (!q || window.__chatTyping) return; window.__chat = (window.__chat || []).concat([{ me: true, t: q }]); window.__chatTyping = true; render(); scrollChat(); const r = A.asistente(q); setTimeout(() => { window.__chat = window.__chat.concat([{ me: false, t: r }]); window.__chatTyping = false; render(); scrollChat(); }, 700 + Math.min(1500, r.length * 6)); };
    $('#ask').onclick = ask; $('#q').onkeydown = (e) => { if (e.key === 'Enter') ask(); }; $$('[data-q]').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; ask(); });
  }

  // ═════════════ MÁS · CONFIG ═════════════
  function vMas() {
    const tiles = SECCIONES.filter(x => x.grupo === 'mas' && x.id !== 'mas' && permitido(x.id));
    shell(`<div class="tiles">${tiles.map(x => `<button class="tile" data-go="${x.id}"><span class="ic">${I(x.icon)}</span><b>${x.label}</b><span class="small muted">Tarifas por zona, extras, espera en aeropuerto, tipo de cambio, pago a choferes y velocidad del demo.</span></button>`).join('')}<a class="tile" href="../cliente/" target="_blank" rel="noopener"><span class="ic">${I('user')}</span><b>App del cliente</b><span class="small muted">Lo que ve el huésped: reservar, pagar, seguir su camioneta y hablar con el chofer.</span></a><a class="tile" href="../chofer/" target="_blank" rel="noopener"><span class="ic">${I('fleet')}</span><b>App del chofer</b><span class="small muted">Viajes que llegan solos, navegación, estados, checklist, gastos y chat.</span></a><button class="tile" id="btnRol"><span class="ic">${I('people')}</span><b>Cambiar rol</b><span class="small muted">Entraste como ${esc(ROLES[rol])}.</span></button><button class="tile" id="btnResetMas"><span class="ic">${I('reset')}</span><b>Reiniciar demo</b><span class="small muted">Regresa los datos ilustrativos al inicio.</span></button></div>
      <div class="card" style="margin-top:12px;"><h3>Sobre este demo</h3><div class="small muted" style="line-height:1.55;">Sistema integral para All Cabo Services: reservas con cotización y pago, despacho automático al chofer más cercano, GPS de la flota, vuelos, CRM de huéspedes y aliados, flota y cumplimiento, tablero del dueño y asistente de IA. Los datos son ilustrativos y viven en este navegador; pagos, WhatsApp, vuelos y el GPS de la flota están simulados (el GPS del teléfono del chofer puede ser real). En la fase real todo corre en la nube y se sincroniza entre dispositivos.</div></div>`, 'Más', 'Configuración, las otras apps y ajustes del demo');
    $('#btnRol').onclick = () => { rol = null; sessionStorage.removeItem('acs_rol'); render(); }; $('#btnResetMas').onclick = () => { if (confirm('¿Reiniciar todos los datos del demo en este navegador?')) { A.reset(); toast('Datos reiniciados'); render(); } };
  }
  function vConfig() {
    const cfg = A.db.config;
    shell(`<div class="grid g2" style="margin-top:0;"><div class="card"><h3>Tarifas por zona <span>· USD, publicadas en su sitio</span></h3>${Object.values(cfg.zonas).map(z => `<div class="grid2" style="margin-top:6px;"><div><label class="lbl">${esc(z.es)} · sencillo</label><input class="txt" data-z="${z.id},sencillo" type="number" value="${z.sencillo}"></div><div><label class="lbl">redondo</label><input class="txt" data-z="${z.id},redondo" type="number" value="${z.redondo}"></div></div>`).join('')}<h3 style="margin-top:14px;">Extras</h3>${cfg.extras.map(e => `<div class="row" style="margin-top:6px;"><span class="small">${esc(e.es)} <span class="muted">· ${esc(e.en)}</span></span><input class="txt" data-ex="${e.id}" type="number" value="${e.precio}" style="width:110px;text-align:right;"></div>`).join('')}</div>
      <div><div class="card"><h3>Operación</h3><label class="lbl">Minutos de espera tras aterrizar</label><input class="txt" id="cEspera" type="number" value="${cfg.esperaAeropuerto}"><label class="lbl">Tipo de cambio MXN por USD</label><input class="txt" id="cTc" type="number" step="0.01" value="${cfg.tipoCambio}"><label class="lbl">Pago al chofer (% del viaje) · supuesto configurable</label><input class="txt" id="cPago" type="number" value="${Math.round(cfg.pagoChoferPct * 100)}"><div class="grid2"><div><label class="lbl">Gasolina MXN por km</label><input class="txt" id="cKm" type="number" step="0.1" value="${cfg.mxnPorKm}"></div><div><label class="lbl">Caseta MXN</label><input class="txt" id="cCaseta" type="number" value="${cfg.caseta}"></div></div></div>
      <div class="card" style="margin-top:12px;"><h3>Demo</h3><label class="lbl">Velocidad del GPS simulado (× tiempo real)</label><input class="txt" id="cFactor" type="number" value="${cfg.factorDemo}"><div class="tiny muted" style="margin-top:6px;">Con ×${cfg.factorDemo}, un traslado de 40 minutos se ve en unos ${Math.round(40 * 60 / cfg.factorDemo)} segundos.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><button class="btn sec sm" id="btnExport">Exportar datos (JSON)</button><button class="btn bad sm" id="btnReset">Reiniciar datos</button></div></div></div></div>
      <button class="btn xl" id="cfgGo" style="margin-top:14px;">Guardar configuración</button>`, 'Configuración', 'Tarifas, extras, espera en aeropuerto, costos y velocidad del demo');
    $('#cfgGo').onclick = () => { $$('[data-z]').forEach(i => { const [z, k] = i.dataset.z.split(','); cfg.zonas[z][k] = Number(i.value) || 0; }); $$('[data-ex]').forEach(i => { const e = cfg.extras.find(x => x.id === i.dataset.ex); if (e) e.precio = Number(i.value) || 0; }); cfg.esperaAeropuerto = Number($('#cEspera').value) || 35; cfg.tipoCambio = Number($('#cTc').value) || cfg.tipoCambio; cfg.pagoChoferPct = (Number($('#cPago').value) || 25) / 100; cfg.mxnPorKm = Number($('#cKm').value) || cfg.mxnPorKm; cfg.caseta = Number($('#cCaseta').value) || 0; cfg.factorDemo = Math.max(1, Number($('#cFactor').value) || 25); A.save(); toast('Configuración guardada; las tres apps la usan ya'); };
    $('#btnExport').onclick = () => { const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(A.db, null, 1)); a.download = 'all-cabo-demo.json'; a.click(); };
    $('#btnReset').onclick = () => { if (confirm('¿Reiniciar todos los datos del demo en este navegador?')) { A.reset(); toast('Datos reiniciados'); render(); } };
  }

  // ═════════════ render ═════════════
  function render() { pendCharts = {}; if (map) { map.remove(); map = null; layers = {}; } if (!rol) { vLogin(); return; } if (!permitido(view)) view = home(); ({ mapa: vMapa, viajes: vViajes, vuelos: vVuelos, clientes: vClientes, aliados: vAliados, cuentas: vCuentas, flota: vFlota, choferes: vChoferes, gastos: vGastos, tablero: vTablero, mas: vMas, config: vConfig }[view] || vMapa)(); }
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v && v !== view) { hist.push(view); view = v; render(); } });
  A.on((motivo) => { if (motivo === 'sim') { actualizarMapa(); return; } if ($('#sheetBg')) return; if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return; render(); });
  A.onEvento((ev) => { if (!rol) return; const v = ev.viajeId ? A.viaje(ev.viajeId) : null; if (!v) return; if (ev.tipo === 'viaje_asignado') toast(`Reserva de ${v.nombre} asignada a ${A.chofer(ev.choferId).nombre}`); if (ev.tipo === 'estado') toast(`${A.ESTADOS[ev.estado].es} · ${v.nombre}`); if (ev.tipo === 'mensaje') toast(`Mensaje ${ev.de === 'cliente' ? 'del cliente' : 'del chofer'} · ${v.nombre}`); });
  render();
})();
</script>
